name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: Full validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
      - name: Check formatting
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -w
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Check reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Check browser JavaScript syntax
        run: git ls-files -z 'static/js/*.js' | xargs -0 -n1 node --check
      - name: Run browser smoke test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
      - name: Check release contracts
        run: bash scripts/check-release-contract.sh
      - name: Require verified real upstream evidence
        run: bash scripts/verify-golden-fixtures.sh --release

  build:
    name: Build and smoke ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ''
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extension: ''
          - name: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: ''
          - name: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            extension: ''
          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Build native artifact
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "filabridge-${{ matrix.name }}${{ matrix.extension }}" .
      - name: Smoke SQLite startup and HTTP readiness
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke-release-artifact.sh "filabridge-${{ matrix.name }}${{ matrix.extension }}"
      - name: Smoke SQLite startup and HTTP readiness on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-release-artifact.ps1 "filabridge-${{ matrix.name }}${{ matrix.extension }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filabridge-${{ matrix.name }}
          path: filabridge-${{ matrix.name }}${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Publish container image
    needs: [test, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  release:
    name: Publish release
    needs: [test, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: filabridge-*
          path: release-assets
          merge-multiple: true
      - name: Generate software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/filabridge-sbom.spdx.json
          upload-artifact: false
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum filabridge-* > checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
